name: Use DevOps Intelligence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    uses: jakemackie/devops-intelligence-action/.github/workflows/pr-review.yml@main
    with:
      clickup_list_id: "901522558612"
      wpcs_strict: false
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}